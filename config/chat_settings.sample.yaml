chat_models:
- session_id: abcdefgh-ijkl-mnop-qrst-uvwxyz123456
  model_name: gemini-3.1-pro-preview
  openai_api_key: YOUR_API_KEY
  openai_base_url: https://www.dmxapi.cn/v1
  temperature: 0.9
  system_prompt: '提示词(前端会自动组装)'
  tools_list:
  - search_memory
  - search_diary
  - access_the_internet
  - screenshot
  agent_plugins:
    context_window:
      enabled: true
      config:
        recent_context_human_messages: 10
        max_images_in_context: 5
        image_ttl_human_messages: 10
        max_screenshots_in_context: 2
        screenshot_ttl_human_messages: 2
    memory:
      enabled: true
      config:
        enable_diary: true
        enable_episodic: true
        enable_semantic: true
        summary_every_human_messages: 10
  name: AI名字
  feature: 性格特点
  character: AI人设
  address: 对用户称呼
  characteristic: 详细性格特点
  constraint: '发言约束'
